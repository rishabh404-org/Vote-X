<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }
        
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            70% {
                transform: scale(1.3);
                opacity: 0;
            }
            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        .scanning-line {
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface antialiased">
<!-- TopNavBar component logic suppressed for transactional flow (Biometric Auth) -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-gutter">
<div class="w-full max-w-[800px] glass-panel rounded-[2rem] p-padding-card flex flex-col items-center">
<!-- Header -->
<div class="w-full flex items-center mb-8 relative">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-primary font-headline-md text-headline-md mr-4 shadow-sm">
                    3
                </div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">
                    Biometric Authentication
                </h1>
</div>
<!-- Stepper -->
<div class="w-full flex justify-between items-center mb-12 relative px-4">
<!-- Connecting Line -->
<div class="absolute top-1/2 left-8 right-8 h-[2px] bg-surface-variant -translate-y-1/2 z-0"></div>
<!-- Active Progress Line (Identity to Biometric) -->
<div class="absolute top-1/2 left-8 w-[40%] h-[2px] bg-primary -translate-y-1/2 z-0 transition-all duration-500"></div>
<!-- Step 1: Identity (Done) -->
<div class="flex flex-col items-center z-10 gap-2">
<div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[18px]">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Identity</span>
</div>
<!-- Step 2: OTP (Done) -->
<div class="flex flex-col items-center z-10 gap-2">
<div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[18px]">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">OTP</span>
</div>
<!-- Step 3: Biometric (Active) -->
<div class="flex flex-col items-center z-10 gap-2">
<div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center shadow-md ring-4 ring-primary-fixed">
<span class="font-label-md text-label-md">3</span>
</div>
<span class="font-label-sm text-label-sm text-primary font-bold">Biometric</span>
</div>
<!-- Step 4: Vote (Pending) -->
<div class="flex flex-col items-center z-10 gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center border border-outline-variant">
<span class="font-label-md text-label-md">4</span>
</div>
<span class="font-label-sm text-label-sm text-outline">Vote</span>
</div>
<!-- Step 5: Done (Pending) -->
<div class="flex flex-col items-center z-10 gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center border border-outline-variant">
<span class="font-label-md text-label-md">5</span>
</div>
<span class="font-label-sm text-label-sm text-outline">Done</span>
</div>
</div>
<!-- Content Area -->
<div class="flex flex-col items-center text-center w-full max-w-md">
<!-- Fingerprint Graphic -->
<div class="relative w-48 h-48 mb-8 flex items-center justify-center group cursor-pointer" id="scanner-area">
<!-- Ambient rings -->
<div class="absolute inset-0 rounded-full border border-primary-fixed-dim/30"></div>
<div class="absolute inset-4 rounded-full border border-primary-fixed-dim/50"></div>
<div class="absolute inset-8 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-primary" style="font-size: 80px; font-variation-settings: 'wght' 200;">fingerprint</span>
<!-- Scanning Line effect (initially hidden) -->
<div class="absolute left-0 right-0 h-1 bg-primary/80 shadow-[0_0_8px_rgba(99,14,212,0.8)] hidden z-10" id="scan-line"></div>
</div>
<!-- Interaction pulse -->
<div class="absolute inset-8 rounded-full bg-primary/10 pulse-ring"></div>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Scan Your Fingerprint</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 px-4">
                    Please place your finger on the scanner<br/>to authenticate
                </p>
<!-- Actions -->
<button class="w-full bg-primary text-white font-label-md text-label-md py-4 rounded-[1rem] shadow-md hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-2 group mb-6" id="start-scan-btn">
                    Start Scanning
                </button>
<a class="inline-flex items-center gap-2 text-primary hover:text-on-primary-fixed-variant transition-colors font-label-md text-label-md" href="#">
<span class="material-symbols-outlined text-[20px]">account_circle</span>
                    Use another method
                </a>
</div>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('start-scan-btn');
            const scanLine = document.getElementById('scan-line');
            const scannerArea = document.getElementById('scanner-area');

            startBtn.addEventListener('click', () => {
                if(startBtn.textContent.trim() === 'Start Scanning') {
                    // Start animation
                    scanLine.classList.remove('hidden');
                    scanLine.classList.add('scanning-line');
                    startBtn.textContent = 'Scanning...';
                    startBtn.classList.add('opacity-80', 'cursor-not-allowed');
                    startBtn.classList.remove('hover:bg-on-primary-fixed-variant');
                    
                    // Simulate completion
                    setTimeout(() => {
                        scanLine.classList.add('hidden');
                        scanLine.classList.remove('scanning-line');
                        startBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Verified';
                        startBtn.classList.remove('bg-primary', 'opacity-80', 'cursor-not-allowed');
                        startBtn.classList.add('bg-green-500', 'text-white');
                        
                        // Briefly show success before theoretical redirect
                        setTimeout(() => {
                            // window.location.href = '#next-step';
                        }, 1000);
                    }, 2500);
                }
            });
        });
    </script>
