<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VOTE-X - OTP Verification</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary-fixed": "#25005a",
                      "on-secondary-fixed-variant": "#444657",
                      "on-primary-container": "#ede0ff",
                      "surface-bright": "#f8f9ff",
                      "primary-fixed-dim": "#d2bbff",
                      "surface": "#f8f9ff",
                      "on-surface": "#0b1c30",
                      "inverse-on-surface": "#eaf1ff",
                      "error-container": "#ffdad6",
                      "on-error": "#ffffff",
                      "surface-container-low": "#eff4ff",
                      "surface-container-high": "#dce9ff",
                      "primary-fixed": "#eaddff",
                      "surface-container-lowest": "#ffffff",
                      "surface-tint": "#732ee4",
                      "inverse-surface": "#213145",
                      "secondary": "#5c5d6f",
                      "background": "#f8f9ff",
                      "error": "#ba1a1a",
                      "surface-dim": "#cbdbf5",
                      "on-primary-fixed-variant": "#5a00c6",
                      "surface-container": "#e5eeff",
                      "surface-container-highest": "#d3e4fe",
                      "primary": "#630ed4",
                      "on-tertiary-container": "#e3e6ee",
                      "outline-variant": "#ccc3d8",
                      "primary-container": "#7c3aed",
                      "tertiary": "#4b4f56",
                      "tertiary-container": "#63676e",
                      "on-secondary-container": "#606174",
                      "on-surface-variant": "#4a4455",
                      "on-tertiary-fixed": "#181c21",
                      "surface-variant": "#d3e4fe",
                      "outline": "#7b7487",
                      "on-tertiary-fixed-variant": "#43474d",
                      "on-primary": "#ffffff",
                      "tertiary-fixed": "#dfe2ea",
                      "secondary-container": "#dedef4",
                      "on-tertiary": "#ffffff",
                      "on-secondary": "#ffffff",
                      "inverse-primary": "#d2bbff",
                      "secondary-fixed": "#e1e1f7",
                      "secondary-fixed-dim": "#c4c5da",
                      "on-secondary-fixed": "#191a2a",
                      "on-background": "#0b1c30",
                      "on-error-container": "#93000a",
                      "tertiary-fixed-dim": "#c3c6ce"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "8px",
                      "container-max": "1200px",
                      "gutter": "24px",
                      "padding-card": "32px",
                      "margin-mobile": "16px"
              },
              "fontFamily": {
                      "label-md": ["Inter"],
                      "display-xl": ["Inter"],
                      "headline-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "label-sm": ["Inter"]
              },
              "fontSize": {

                      "display-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],

                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],

            }
          }
        }

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }
        .otp-input::-webkit-outer-spin-button,
        .otp-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .otp-input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center p-gutter">
<!-- Suppressed TopNavBar and BottomNavBar as this is a transactional flow -->
<main class="w-full max-w-[800px] mx-auto">
<div class="glass-card rounded-xl p-padding-card flex flex-col items-center text-center">
<!-- Header -->
<div class="flex items-center gap-3 w-full mb-8">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold font-label-md text-label-md shrink-0">2</div>
<h1 class="font-headline-md text-headline-md text-on-surface">OTP Verification</h1>
</div>
<!-- Stepper -->
<div class="w-full max-w-2xl mx-auto mb-12 flex items-center justify-between relative">
<div class="absolute top-1/2 left-0 w-full h-0.5 bg-outline-variant -z-10 -translate-y-1/2"></div>
<!-- Step 1: Done -->
<div class="flex flex-col items-center gap-2 bg-surface px-2">
<div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center">
<span class="material-symbols-outlined text-sm" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Identity</span>
</div>
<!-- Step 2: Active -->
<div class="flex flex-col items-center gap-2 bg-surface px-2">
<div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold">2</div>
<span class="font-label-sm text-label-sm text-primary font-bold">OTP</span>
</div>
<!-- Step 3: Pending -->
<div class="flex flex-col items-center gap-2 bg-surface px-2">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-bold">3</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Biometric</span>
</div>
<!-- Step 4: Pending -->
<div class="flex flex-col items-center gap-2 bg-surface px-2">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-bold">4</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Vote</span>
</div>
<!-- Step 5: Pending -->
<div class="flex flex-col items-center gap-2 bg-surface px-2">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-bold">5</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Done</span>
</div>
</div>
<!-- Icon -->
<div class="w-20 h-20 rounded-full bg-primary-container/20 text-primary flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-4xl" data-icon="smartphone" data-weight="fill" style="font-variation-settings: 'FILL' 1;">smartphone</span>
</div>
<!-- Titles & Instructions -->
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Enter OTP</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-6 max-w-sm">
                We have sent a 6-digit OTP to your registered mobile number
                <br/>
<strong class="text-on-surface font-semibold mt-1 inline-block">+91 98******42</strong>
</p>
<!-- OTP Inputs -->
<div class="flex items-center gap-3 mb-8 w-full justify-center">
<input aria-label="Digit 1" class="otp-input w-12 h-14 rounded-lg border border-outline-variant bg-surface text-center font-headline-md text-headline-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" maxlength="1" placeholder="-" type="number"/>
<input aria-label="Digit 2" class="otp-input w-12 h-14 rounded-lg border border-outline-variant bg-surface text-center font-headline-md text-headline-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" maxlength="1" placeholder="-" type="number"/>
<input aria-label="Digit 3" class="otp-input w-12 h-14 rounded-lg border border-outline-variant bg-surface text-center font-headline-md text-headline-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" maxlength="1" placeholder="-" type="number"/>
<input aria-label="Digit 4" class="otp-input w-12 h-14 rounded-lg border border-outline-variant bg-surface text-center font-headline-md text-headline-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" maxlength="1" placeholder="-" type="number"/>
<input aria-label="Digit 5" class="otp-input w-12 h-14 rounded-lg border border-outline-variant bg-surface text-center font-headline-md text-headline-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" maxlength="1" placeholder="-" type="number"/>
<input aria-label="Digit 6" class="otp-input w-12 h-14 rounded-lg border border-outline-variant bg-surface text-center font-headline-md text-headline-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" maxlength="1" placeholder="-" type="number"/>
</div>
<!-- Resend & Action -->
<p class="font-label-sm text-label-sm text-primary mb-6 cursor-pointer hover:underline">
                Resend OTP in 00:30
            </p>
<button class="w-full max-w-sm h-14 rounded-lg bg-primary text-on-primary font-label-md text-label-md flex items-center justify-center hover:bg-primary/90 transition-colors shadow-md">
                Verify OTP
            </button>
<div class="mt-6 font-label-sm text-label-sm text-on-surface-variant">
                Didn't receive OTP? <button class="text-primary hover:underline font-semibold bg-transparent border-none p-0 cursor-pointer">Resend</button>
</div>
</div>
</main>
<!-- Suppressed Footer as this is a transactional flow -->
<script>
        // Simple OTP input navigation
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if(e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0,1);
                }
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body></html>
